on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        default: "0.0.0"
        required: true
        type: string
      release:
        type: boolean
        default: false
        description: "Release"
      beta:
        type: boolean
        default: false
        description: "Beta"
      draft:
        type: boolean
        default: true
        description: "Draft"

env:
  release-name: ${{ inputs.version }}${{ inputs.beta && ' Beta' || '' }}

jobs:
  build:
    runs-on: ${{ matrix.arch.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        arch:
          - { name: win-x64, rid: win-x64, arch: x64, os: win, runs-on: windows-latest }
          - { name: win-x86, rid: win-x86, arch: x86, os: win, runs-on: windows-latest }
          - { name: win-arm64, rid: win-arm64, arch: arm64, os: win, runs-on: windows-latest }
          - { name: osx-x64, rid: osx-x64, arch: x64, os: osx, runs-on: macos-15-intel }
          - { name: osx-arm64, rid: osx-arm64, arch: arm64, os: osx, runs-on: macos-15-intel }
          - { name: linux-x64, rid: linux-x64, arch: x64, os: linux, runs-on: ubuntu-latest, linuxarch: x86_64}
          - { name: linux-arm64, rid: linux-arm64, arch: arm64, os: linux, runs-on: ubuntu-latest, linuxarch: aarch64}

    steps:
      # Setup
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install NSIS via Chocolatey
        shell: pwsh
        run: |
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (Test-Path $nsis) { Write-Host "NSIS already present"; exit 0 }
          for ($i = 1; $i -le 3; $i++) {
            choco install nsis --version=3.11 -y --no-progress
            if (Test-Path $nsis) { exit 0 }
            Write-Host "Attempt $i failed, retrying in 30s"
            Start-Sleep -Seconds 30
          }
          throw "NSIS install failed after 3 attempts"
        if: ${{ matrix.arch.os == 'win' }}
      - uses: justalemon/VersionPatcher@v0.7.1
        with:
          version: ${{ inputs.version }}
          csproj-files: "OpenUtau/*.csproj"

      # Guards
      - name: Show build mode
        shell: bash
        run: |
          if [ "${{ inputs.release }}" = "true" ]; then
            echo "### Mode: RELEASE — assets go to the \`${{ inputs.version }}\` release (draft=${{ inputs.draft }})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Mode: ARTIFACTS ONLY — nothing is uploaded to any release." >> "$GITHUB_STEP_SUMMARY"
            echo "Re-run with the **Release** box ticked to publish \`${{ inputs.version }}\`." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Ref: \`${{ github.ref_name }}\` · Version: \`${{ inputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify branding
        shell: bash
        run: |
          set -euo pipefail
          assembly=$(sed -n 's:.*<AssemblyName>\(.*\)</AssemblyName>.*:\1:p' OpenUtau/OpenUtau.csproj)
          bundle=$(sed -n 's:.*<CFBundleName>\(.*\)</CFBundleName>.*:\1:p' OpenUtau/OpenUtau.csproj)
          echo "ref=${{ github.ref_name }} AssemblyName=$assembly CFBundleName=$bundle"
          if [ "$assembly" != "OpenUtau-PRINTmov" ]; then
            echo "::error::Building '$assembly', not OpenUtau-PRINTmov. This ref (${{ github.ref_name }}) lacks the PRINTmov branding — dispatch from printmov-build."
            exit 1
          fi
          echo "APP_BUNDLE=$bundle.app" >> "$GITHUB_ENV"

      # Test
      - name: Test
        run: dotnet test OpenUtau.Test

      # Build
      - name: Restore
        run: dotnet restore OpenUtau -r ${{ matrix.arch.rid }}

      - name: Build (Windows and Linux)
        run: dotnet publish OpenUtau -c Release -r ${{ matrix.arch.rid }} --self-contained true -o bin/${{ matrix.arch.name }}/
        if: ${{ matrix.arch.os != 'osx' }}

      - name: Build (MacOS)
        run: dotnet msbuild OpenUtau -t:BundleApp -p:Configuration=Release -p:RuntimeIdentifier=${{ matrix.arch.rid }} -p:UseAppHost=true -p:SelfContained=true -p:OutputPath=../bin/${{ matrix.arch.name }}/
        if: ${{ matrix.arch.os == 'osx' }}
      
      - name: Write release channel info
        run: "@{Beta=$${{ inputs.beta }}} | ConvertTo-Json > bin/${{ matrix.arch.name }}/prefs-default.json"
        shell: pwsh

      # Create Zip
      - name: DirectML
        shell: cmd
        run: |
          curl -L https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/1.15.4 -o Microsoft.AI.DirectML.nupkg
          mkdir Microsoft.AI.DirectML
          tar -xf Microsoft.AI.DirectML.nupkg -C Microsoft.AI.DirectML
          copy /y Microsoft.AI.DirectML\bin\${{ matrix.arch.arch }}-${{ matrix.arch.os }}\DirectML.dll bin\${{ matrix.arch.name }}\
        if: ${{ matrix.arch.os == 'win' }}

      - name: Set executable permission
        run: chmod +x bin/${{ matrix.arch.name }}/OpenUtau-PRINTmov
        if: ${{ matrix.arch.os == 'linux' }}

      - name: Zip
        run: |
          cd bin/${{ matrix.arch.name }}
          7z a ../../OpenUtau-PRINTmov-${{ matrix.arch.name }}.zip *
        if: ${{ matrix.arch.os == 'win' }}

      - name: Tar.gz
        run: |
          cd bin/${{ matrix.arch.name }}
          tar -czf ../../OpenUtau-PRINTmov-${{ matrix.arch.name }}.tar.gz *
        if: ${{ matrix.arch.os == 'linux' }}

      # Create Installer
      - name: Get VC Redist
        run: |
          curl https://aka.ms/vs/17/release/vc_redist.${{ matrix.arch.arch }}.exe -o vc_redist.${{ matrix.arch.arch }}.exe
        if: ${{ matrix.arch.os == 'win' }}

      - name: Create Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DPRODUCT_VERSION=${{ inputs.version }}" "/DARCH=${{ matrix.arch.arch }}" OpenUtau.nsi
        if: ${{ matrix.arch.os == 'win' }}

      # Create Dmg
      - name: Create Dmg
        run: |
          set -euo pipefail
          npm install -g create-dmg
          latest_xcode=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1)
          if [ -n "$latest_xcode" ]; then
            sudo xcode-select -s "$latest_xcode"
          fi
          xcodebuild -version || true

          shopt -s nullglob
          apps=(bin/${{ matrix.arch.name }}/publish/*.app)
          shopt -u nullglob
          if [ ${#apps[@]} -ne 1 ]; then
            echo "::error::Expected exactly 1 .app in bin/${{ matrix.arch.name }}/publish, found ${#apps[@]}: ${apps[*]:-<none>}"
            exit 1
          fi
          app="${apps[0]}"
          if [ "$(basename "$app")" != "$APP_BUNDLE" ]; then
            echo "::error::Bundle is '$(basename "$app")' but csproj says '$APP_BUNDLE' — BundleApp did not pick up CFBundleName."
            exit 1
          fi
          echo "Bundle: $app"

          # VersionPatcher only rewrites <Version>; CFBundle* stay at their csproj literals.
          plutil -replace CFBundleShortVersionString -string "${{ inputs.version }}" "$app/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "${{ inputs.version }}" "$app/Contents/Info.plist"

          cp OpenUtau/Assets/pmou.icns "$app/Contents/Resources/"
          if xcrun actool --help 2>&1 | grep -q -- '--enable-icon-stack-fallback-generation'; then
            xcrun actool OpenUtau/Assets/pmou-mac.icon \
              --compile "$app/Contents/Resources" \
              --app-icon pmou-mac \
              --enable-on-demand-resources NO \
              --development-region en \
              --target-device mac \
              --platform macosx \
              --enable-icon-stack-fallback-generation=disabled \
              --include-all-app-icons \
              --minimum-deployment-target 11.0 \
              --output-partial-info-plist /dev/null
            plutil -replace CFBundleIconName -string pmou-mac "$app/Contents/Info.plist"
          else
            echo "::warning::actool has no Icon Composer support on this runner — shipping the legacy pmou.icns only."
          fi

          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # An .app that never got a real bundle signature reports "Sealed Resources=none"
          # and Identifier=apphost — that is the .NET stub, not our signature.
          info=$(codesign -dv --verbose=2 "$app" 2>&1)
          echo "$info"
          if echo "$info" | grep -q "Sealed Resources=none"; then
            echo "::error::codesign left the bundle unsealed — the app is not actually signed."
            exit 1
          fi

          out=OpenUtau-PRINTmov-${{ matrix.arch.name }}.dmg
          rm -f ./*.dmg
          # create-dmg exits 2 when it succeeds but emits warnings, so check for the file instead.
          create-dmg "$app" || true
          shopt -s nullglob
          dmgs=(*.dmg)
          shopt -u nullglob
          if [ ${#dmgs[@]} -ne 1 ]; then
            echo "::error::create-dmg produced ${#dmgs[@]} dmg files (expected 1): ${dmgs[*]:-<none>}"
            exit 1
          fi
          mv "${dmgs[0]}" "$out"
          codesign -fvs - "$out"
          hdiutil verify "$out"
        if: ${{ matrix.arch.os == 'osx' }}

      # Create Appimage
      - name: Install LinuxDeploy
        uses: AnimMouse/setup-appimage@v1
        with:
          name: linuxdeploy
          url: https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        if: ${{ matrix.arch.os == 'linux' }}

      - name: Create appimage
        run: |
          cp OpenUtau/Assets/OpenUtau.desktop bin/${{ matrix.arch.name }}
          cp OpenUtau/Assets/OpenUtau.png bin/${{ matrix.arch.name }}
          cp OpenUtau/Assets/OpenUtau.png bin/${{ matrix.arch.name }}/.DirIcon
          cp OpenUtau/Assets/AppRun bin/${{ matrix.arch.name }}
          chmod 755 bin/${{ matrix.arch.name }}/AppRun
          ARCH=${{ matrix.arch.linuxarch }} linuxdeploy --appdir bin/${{ matrix.arch.name }} --output appimage
          mv OpenUtau-${{ matrix.arch.linuxarch }}.AppImage OpenUtau-PRINTmov-${{ matrix.arch.name }}.AppImage
        if: ${{ matrix.arch.os == 'linux' }}

      # Upload Artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: OpenUtau-PRINTmov-${{ matrix.arch.name }}.tar.gz
          path: OpenUtau-PRINTmov-${{ matrix.arch.name }}.tar.gz
        if: ${{ !inputs.release && matrix.arch.os == 'linux' }}

      - uses: actions/upload-artifact@v4
        with:
          name: OpenUtau-PRINTmov-${{ matrix.arch.name }}.zip
          path: OpenUtau-PRINTmov-${{ matrix.arch.name }}.zip
        if: ${{ !inputs.release && matrix.arch.os == 'win' }}

      - uses: actions/upload-artifact@v4
        with:
          name: OpenUtau-PRINTmov-${{ matrix.arch.name }}.exe
          path: OpenUtau-PRINTmov-${{ matrix.arch.name }}.exe
        if: ${{ !inputs.release && matrix.arch.os == 'win' }}
      
      - uses: actions/upload-artifact@v4
        with:
          name: OpenUtau-PRINTmov-${{ matrix.arch.name }}.AppImage
          path: OpenUtau-PRINTmov-${{ matrix.arch.name }}.AppImage
        if: ${{ !inputs.release && matrix.arch.os == 'linux' }}

      - uses: actions/upload-artifact@v4
        with:
          name: OpenUtau-PRINTmov-${{ matrix.arch.name }}.dmg
          path: OpenUtau-PRINTmov-${{ matrix.arch.name }}.dmg
        if: ${{ !inputs.release && matrix.arch.os == 'osx' }}

      # Appcast
      - name: Appcast Windows
        shell: cmd
        run: |
          python appcast.py -v=${{ inputs.version }} -o=windows -r=${{ matrix.arch.name }} -f=OpenUtau-PRINTmov-${{ matrix.arch.name }}.zip
          python appcast.py -v=${{ inputs.version }} -o=windows -r=${{ matrix.arch.name }}-installer -f=OpenUtau-PRINTmov-${{ matrix.arch.name }}.exe
        if: ${{ inputs.release && matrix.arch.os == 'win' }}

      - name: Appcast MacOS
        run: |
          python appcast.py -v=${{ inputs.version }} -o=macos -r=${{ matrix.arch.name }} -f=OpenUtau-PRINTmov-${{ matrix.arch.name }}.dmg
        if: ${{ inputs.release && matrix.arch.os == 'osx' }}

      - name: Appcast Linux
        run: |
          python appcast.py -v=${{ inputs.version }} -o=linux -r=${{ matrix.arch.name }} -f=OpenUtau-PRINTmov-${{ matrix.arch.name }}.tar.gz
        if: ${{ inputs.release && matrix.arch.os == 'linux' }}

      # Release
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ env.release-name }}
          prerelease: ${{ inputs.beta }}
          draft: ${{ inputs.draft }}
          fail_on_unmatched_files: true
          files: |
            appcast.${{ matrix.arch.name }}*.xml
            OpenUtau-PRINTmov-${{ matrix.arch.name }}.*
          body: |
            **OpenUtau - PRINTmov Edition** — a customized build based on [OpenUtau](https://github.com/stakira/OpenUtau).

            See [Getting Started](https://github.com/stakira/OpenUtau/wiki/Getting-Started) and the [FAQ](https://github.com/stakira/OpenUtau/wiki/FAQ) for general usage.

            ## macOS says "PMOU cannot be opened because it is from an unidentified developer"
            The app is signed, but not notarized by Apple. To open it the first time:

            1. Drag **PMOU.app** to Applications and try to open it.
            2. Open **System Settings → Privacy & Security**, scroll down, and click **Open Anyway**.
            3. Confirm. macOS remembers the choice, so this is only needed once.

            On macOS 14 and earlier you can instead right-click the app and choose **Open**.
        if: ${{ inputs.release }}
